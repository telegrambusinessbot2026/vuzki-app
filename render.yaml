# =====================================================================
# VUZKI - Render Blueprint
#
# ONE web service (vuzki-web) running the CONSOLIDATED single-process server
# (apps/web/server.js) that serves the whole product on ONE port:
#   1. the public VUZKI website  (https://vuzki.app/, /features, ...)
#   2. the VUZKI web application (/auth/*, /app/*)
#   3. the VUZKI admin panel     (/admin/*)
#   4. the Express API           (/api/v1, /health, /ready, /uploads)
#   5. Socket.IO realtime        (/socket.io)
#   6. the worker loops          (deletions, retention, stale calls)
#
# Start order inside server.js:
#   http.createServer(dispatch) -> createRealtimeServer(httpServer) (Socket.IO)
#   -> nextApp.prepare() -> startWorkerLoops() -> listen(0.0.0.0:$PORT)
#
# There is intentionally NO second backend service: the Express API and
# Socket.IO run inside the SAME process as Next.js, so everything is same-origin
# under https://vuzki.app and no CORS/server-URL configuration is needed.
# The old separate admin (apps/admin) and website (apps/website) apps are kept
# in the repo for rollback/reference but are NOT deployed.
# =====================================================================

services:
  - type: web
    name: vuzki-web
    runtime: node
    plan: starter
    # CRITICAL: Render injects service env vars (incl. NODE_ENV=production below)
    # into the build environment. A bare `npm install` under NODE_ENV=production
    # omits dev dependencies (turbo, typescript, tailwindcss), which are required
    # to build the Next.js app and the @vuzki workspace packages. `--include=dev`
    # forces them to be installed for the build.
    #
    # `npm run build:consolidated` = `turbo run build --filter=@vuzki/api
    # --filter=@vuzki/web`. Turbo builds the workspace dependencies first
    # (@vuzki/shared, @vuzki/utils, @vuzki/types, @vuzki/database, @vuzki/api ->
    # tsc -> dist), so the custom server's `@vuzki/api/dist/*` imports resolve.
    buildCommand: npm install --include=dev && npm run build:consolidated
    # `npm run start:consolidated` -> `node apps/web/server.js`. Listens on
    # Render's PORT env var (0.0.0.0:$PORT) and serves web + API + Socket.IO +
    # worker loops in one process (NOT `next start`, NOT standalone output).
    startCommand: npm run start:consolidated
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: NODE_ENV
        value: production
      # Production fails fast unless these server secrets are set.
      - key: JWT_SECRET
        sync: false            # set in Render dashboard / secret manager
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false            # set in Render dashboard / secret manager
      - key: REDIS_URL
        sync: false
      # ---- Same-origin routing (website, app AND API use https://vuzki.app) ----
      - key: API_PUBLIC_URL
        value: https://vuzki.app
      - key: WEB_URL
        value: https://vuzki.app
      - key: ADMIN_URL
        value: https://vuzki.app
      - key: WEBSITE_URL
        value: https://vuzki.app
      - key: CORS_ORIGINS
        value: https://vuzki.app
      # ---- Public / browser-safe (NEXT_PUBLIC_* are inlined at build time) ----
      - key: NEXT_PUBLIC_API_URL
        value: https://vuzki.app/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://vuzki.app
      - key: NEXT_PUBLIC_APP_NAME
        value: VUZKI
      - key: NEXT_PUBLIC_SITE_URL
        value: https://vuzki.app

  # ------------------------------------------------------------------
  # CONSOLIDATED TOPOLOGY NOTE
  # ------------------------------------------------------------------
  # apps/api and apps/web are deployed together via build:consolidated above.
  # There is NO separate vuzki-api service on Render anymore. All server env
  # vars (payments, RTC, storage, SMTP, feature flags, etc.) are set on THIS
  # service in the Render dashboard / secret manager.